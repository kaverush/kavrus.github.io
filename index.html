<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      padding: 40px 25px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      color: #cbd5e1;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Welcome! 🚀</h1>

    <p>This is my first website.</p>

    <button onclick="hello()">
      Click Me
    </button>
  </div>

  <script>
    function hello() {
      alert("It works! 🎉");
    }
  </script>

</body>
  </html>
