<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Birthday Surprise</title>
<style>
:root{
  --bg1:#05030A; --bg2:#160819; --bg3:#3A1027; --bg4:#120512;
  --wine:#5c1633; --crimson:#b3294f; --pink:#e39bb0; --gold:#d9b26a; --cream:#f3e7d8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:'Cormorant Garamond','Georgia',serif; color:var(--cream); overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 30%, rgba(100,30,80,.35), transparent 45%),
    linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
}
h1,h2{font-family:'Playfair Display','Cormorant Garamond',serif; font-weight:400; letter-spacing:.03em;}
p,button{font-family:'Inter','DM Sans',sans-serif;}
canvas#fx{position:fixed; inset:0; z-index:0; pointer-events:none;}
.screen{display:none; min-height:100vh; position:relative; z-index:1; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:6vh 6vw;}
.screen.active{display:flex;}
.fade-up{animation:fadeUp 1.1s cubic-bezier(.2,.8,.2,1) both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(24px) scale(.98); filter:blur(6px);} to{opacity:1; transform:translateY(0) scale(1); filter:blur(0);}}
.d1{animation-delay:.1s;} .d2{animation-delay:.5s;} .d3{animation-delay:.9s;} .d4{animation-delay:1.3s;}

/* PIN */
.pin-card{background:rgba(20,8,20,.55); backdrop-filter:blur(16px); border:1px solid rgba(217,178,106,.25);
  border-radius:22px; padding:44px 28px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.5);}
.pin-eyebrow{letter-spacing:.25em; font-size:.75rem; text-transform:uppercase; color:var(--gold); opacity:.85;}
.pin-title{font-size:1.5rem; margin:10px 0 26px; color:var(--cream);}
.pin-row{display:flex; gap:6px; justify-content:center; flex-wrap:nowrap; margin-bottom:18px;}
.pin-dot{width:9vw; max-width:34px; height:9vw; max-height:34px; border-radius:50%; border:1.5px solid rgba(243,231,216,.35);
  display:flex; align-items:center; justify-content:center; position:relative; transition:.3s; flex:0 0 auto;}
